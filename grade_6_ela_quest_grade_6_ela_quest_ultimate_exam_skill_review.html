    <script>
        /* Web Audio API Synthesizer for Retro Gaming SFX */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playCorrect() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            }

            playIncorrect() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.25);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }

            playLevelUp() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.15);
                });
            }

            playClick() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.04);
            }
        }

        const soundFX = new SoundEngine();
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

        function toggleMute() {
            soundFX.muted = !soundFX.muted;
            const btn = document.getElementById('mute-btn');
            if (soundFX.muted) {
                btn.innerHTML = '<i class="fa-solid fa-volume-xmark text-base text-red-400"></i>';
            } else {
                btn.innerHTML = '<i class="fa-solid fa-volume-high text-base"></i>';
                soundFX.playClick();
            }
        }

        function startTimer() {
            gameState.startTime = new Date();
            gameState.elapsedSeconds = 0;
            clearInterval(gameState.timerInterval);
            gameState.timerInterval = setInterval(() => {
                gameState.elapsedSeconds++;
                const mins = Math.floor(gameState.elapsedSeconds / 60).toString().padStart(2, '0');
                const secs = (gameState.elapsedSeconds % 60).toString().padStart(2, '0');
                const timerElem = document.getElementById('timer-display');
                if (timerElem) timerElem.innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(gameState.timerInterval);
        }

                        <div class="bg-slate-900/90 p-5 rounded-xl border border-emerald-500/20">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-xs font-bold text-emerald-400 uppercase">Category 3</span>

                            <h3 class="font-bold text-white text-base mb-1">Across Genres & Vocab</h3>
                            <p class="text-xs text-slate-400 leading-relaxed">Greek/Latin roots (V.1.2), context clues (V.1.3), pronoun conventions (C.3.1), narrative techniques (C.1.2).</p>

        }

        function validateAndStartQuest() {
            const nameInput = document.getElementById('input-student-name').value.trim();
            const periodInput = document.getElementById('input-class-period').value.trim();

            if (!nameInput) {
                alert("Please enter your name before starting the exam for Canvas score tracking!");
                return;
            }

            gameState.studentName = nameInput;
            gameState.classPeriod = periodInput || "N/A";
            startMainQuest();
        }

        /* 2. Main Question Engine View */
        function startMainQuest() {
            soundFX.playClick();
            gameState.currentIndex = 0;
            gameState.score = 0;
            gameState.xp = 0;
            gameState.streak = 0;
            gameState.answers = [];
            gameState.categoryScores = {
                prose_poetry: { correct: 0, total: 0 },
                informational_text: { correct: 0, total: 0 },
                vocabulary_conventions: { correct: 0, total: 0 }
            };
            
            // Build benchmark list
            QUESTION_BANK.forEach(q => {
                if (!gameState.benchmarkScores[q.benchmark]) {
                    gameState.benchmarkScores[q.benchmark] = { correct: 0, total: 0 };
                }
            });

            updateHeaderStats();
            startTimer();
            renderQuestion();
        }

        function updateHeaderStats() {
            document.getElementById('player-xp').innerText = `${gameState.xp} XP`;
            document.getElementById('player-streak').innerText = `${gameState.streak}x`;
        }

        function renderQuestion() {
            const q = QUESTION_BANK[gameState.currentIndex];
            gameState.selectedMulti = [];
            gameState.selectedEbsrPartA = null;
            gameState.selectedEbsrPartB = null;

            const container = document.getElementById('app-container');
            const hasPassage = q.passage !== null;

            container.innerHTML = `
                <div class="w-full max-w-6xl mx-auto space-y-4">
                    <!-- Progress Bar & Question Meta Header -->
                    <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800 flex flex-wrap items-center justify-between gap-4">
                        <div class="flex items-center gap-3">
                            <span class="pixel-font text-xs text-indigo-400 bg-indigo-950/80 border border-indigo-800/60 px-3 py-1 rounded">
                                QUESTION ${gameState.currentIndex + 1}/20
                            </span>
                            <span class="text-xs font-semibold px-2.5 py-1 bg-slate-800 text-slate-300 rounded-md">
                                Benchmark: <strong class="text-amber-400">${q.benchmark}</strong>
                            </span>
                            <span class="text-xs font-bold px-2 py-0.5 ${q.dok === 1 ? 'bg-blue-500/20 text-blue-300' : q.dok === 2 ? 'bg-amber-500/20 text-amber-300' : 'bg-red-500/20 text-red-300'} rounded">
                                DOK Level ${q.dok}
                            </span>
                        </div>
                        
                        <!-- Mini Progress Bar -->
                        <div class="w-full md:w-48 bg-slate-800 h-2.5 rounded-full overflow-hidden">
                            <div class="bg-gradient-to-r from-blue-500 to-indigo-500 h-full transition-all duration-300" style="width: ${((gameState.currentIndex + 1) / 20) * 100}%"></div>
                        </div>
                    </div>

                    <!-- Question Body Grid -->
                    <div class="grid grid-cols-1 ${hasPassage ? 'lg:grid-cols-2' : ''} gap-6">
                        
                        ${hasPassage ? `
                        <div class="bg-slate-900/90 p-5 rounded-xl border border-slate-800 flex flex-col h-full max-h-[500px]">
                            <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
                                <h3 class="font-bold text-slate-200 text-sm uppercase tracking-wider flex items-center gap-2">
                                    <i class="fa-solid fa-book-open text-indigo-400"></i> ${q.passage.title}
                                </h3>
                                <span class="text-[10px] text-slate-400 uppercase">Reading Passage</span>
                            </div>
                            <div class="overflow-y-auto custom-scrollbar pr-2 text-slate-300 text-sm leading-relaxed whitespace-pre-line font-serif">
                                ${q.passage.text}
                            </div>
                        </div>
                        ` : ''}

                        <!-- Interactive Question Options -->
                        <div class="bg-slate-900/90 p-5 rounded-xl border border-slate-800 flex flex-col justify-between space-y-4">
                            
                            <div>
                                <span class="text-xs font-bold text-indigo-400 uppercase tracking-wide block mb-1">${q.categoryTitle}</span>
                                
                                ${q.type === 'single' ? `
                                    <h2 class="text-base md:text-lg font-bold text-white mb-4 leading-snug">${q.question}</h2>
                                    <div class="space-y-2.5" id="options-container">
                                        ${q.options.map((opt, idx) => `
                                            <button onclick="selectSingleOption(${idx})" id="opt-${idx}" class="w-full text-left p-3.5 rounded-xl border border-slate-800 bg-slate-950/60 hover:bg-slate-800/80 hover:border-slate-700 text-sm font-medium transition flex items-start gap-3 group">
                                                <span class="w-6 h-6 rounded-lg bg-slate-800 group-hover:bg-indigo-600 group-hover:text-white text-slate-400 text-xs flex items-center justify-center font-bold shrink-0 transition">
                                                    ${String.fromCharCode(65 + idx)}
                                                </span>
                                                <span class="text-slate-200">${opt.substring(3)}</span>
                                            </button>
                                        `).join('')}
                                    </div>
                                ` : ''}

                                ${q.type === 'multi' ? `
                                    <h2 class="text-base md:text-lg font-bold text-white mb-1 leading-snug">${q.question}</h2>
                                    <p class="text-xs text-amber-400 mb-4 font-semibold"><i class="fa-solid fa-circle-info mr-1"></i> Select exactly TWO options</p>
                                    <div class="space-y-2.5" id="options-container">
                                        ${q.options.map((opt, idx) => `
                                            <button onclick="toggleMultiOption(${idx})" id="opt-${idx}" class="w-full text-left p-3.5 rounded-xl border border-slate-800 bg-slate-950/60 hover:bg-slate-800/80 text-sm font-medium transition flex items-start gap-3">
                                                <span id="checkbox-${idx}" class="w-6 h-6 rounded-md border border-slate-700 bg-slate-800 text-xs flex items-center justify-center font-bold shrink-0"></span>
                                                <span class="text-slate-200">${opt}</span>
                                            </button>
                                        `).join('')}
                                    </div>
                                ` : ''}

                                ${q.type === 'ebsr' ? `
                                    <div class="space-y-4">
                                        <!-- PART A -->
                                        <div class="p-3 bg-slate-950/60 rounded-xl border border-slate-800">
                                            <h3 class="text-sm font-bold text-amber-400 mb-2">${q.questionPartA}</h3>
                                            <div class="space-y-2">
                                                ${q.optionsPartA.map((opt, idx) => `
                                                    <button onclick="selectEbsrPartA(${idx})" id="ebsr-a-${idx}" class="w-full text-left p-2.5 rounded-lg border border-slate-800 bg-slate-900 text-xs text-slate-200 hover:bg-slate-800 transition">
                                                        ${opt}
                                                    </button>
                                                `).join('')}
                                            </div>
                                        </div>

                                        <!-- PART B -->
                                        <div class="p-3 bg-slate-950/60 rounded-xl border border-slate-800">
                                            <h3 class="text-sm font-bold text-amber-400 mb-2">${q.questionPartB}</h3>
                                            <div class="space-y-2">
                                                ${q.optionsPartB.map((opt, idx) => `
                                                    <button onclick="selectEbsrPartB(${idx})" id="ebsr-b-${idx}" class="w-full text-left p-2.5 rounded-lg border border-slate-800 bg-slate-900 text-xs text-slate-200 hover:bg-slate-800 transition">
                                                        ${opt}
                                                    </button>
                                                `).join('')}
                                            </div>
                                        </div>
                                    </div>
                                ` : ''}
                            </div>

                            <!-- Explanation Feedback Box -->
                            <div id="explanation-box" class="hidden p-4 rounded-xl text-xs leading-relaxed"></div>

                            <!-- Action Bar Button -->
                            <div id="action-bar" class="pt-2">
                                <button onclick="submitAnswer()" id="submit-btn" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-check-circle"></i> SUBMIT ANSWER
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        /* Interactive Selection Logic */
        let activeSelection = null;

        function selectSingleOption(index) {
            soundFX.playClick();
            activeSelection = index;
            const q = QUESTION_BANK[gameState.currentIndex];
            for (let i = 0; i < q.options.length; i++) {
                const btn = document.getElementById(`opt-${i}`);
                if (i === index) {
                    btn.className = "w-full text-left p-3.5 rounded-xl border-2 border-indigo-500 bg-indigo-950/40 text-sm font-medium transition flex items-start gap-3";
                } else {
                    btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-800 bg-slate-950/60 hover:bg-slate-800/80 text-sm font-medium transition flex items-start gap-3 opacity-60";
                }
            }
        }

        function toggleMultiOption(index) {
            soundFX.playClick();
            const pos = gameState.selectedMulti.indexOf(index);
            if (pos > -1) {
                gameState.selectedMulti.splice(pos, 1);
            } else {
                if (gameState.selectedMulti.length < 2) {
                    gameState.selectedMulti.push(index);
                }
            }

            const q = QUESTION_BANK[gameState.currentIndex];
            for (let i = 0; i < q.options.length; i++) {
                const btn = document.getElementById(`opt-${i}`);
                const chk = document.getElementById(`checkbox-${i}`);
                if (gameState.selectedMulti.includes(i)) {
                    btn.className = "w-full text-left p-3.5 rounded-xl border-2 border-indigo-500 bg-indigo-950/40 text-sm font-medium transition flex items-start gap-3";
                    chk.className = "w-6 h-6 rounded-md bg-indigo-600 text-white text-xs flex items-center justify-center font-bold shrink-0";
                    chk.innerHTML = '<i class="fa-solid fa-check text-xs"></i>';
                } else {
                    btn.className = "w-full text-left p-3.5 rounded-xl border border-slate-800 bg-slate-950/60 text-sm font-medium transition flex items-start gap-3";
                    chk.className = "w-6 h-6 rounded-md border border-slate-700 bg-slate-800 text-xs flex items-center justify-center font-bold shrink-0";
                    chk.innerHTML = '';
                }
            }
        }

        function selectEbsrPartA(index) {
            soundFX.playClick();
            gameState.selectedEbsrPartA = index;
            const q = QUESTION_BANK[gameState.currentIndex];
            for (let i = 0; i < q.optionsPartA.length; i++) {
                const btn = document.getElementById(`ebsr-a-${i}`);
                if (i === index) {
                    btn.className = "w-full text-left p-2.5 rounded-lg border-2 border-amber-500 bg-amber-950/40 text-xs text-white transition font-semibold";
                } else {
                    btn.className = "w-full text-left p-2.5 rounded-lg border border-slate-800 bg-slate-900 text-xs text-slate-400 hover:bg-slate-800 transition opacity-60";
                }
            }
        }

        function selectEbsrPartB(index) {
            soundFX.playClick();
            gameState.selectedEbsrPartB = index;
            const q = QUESTION_BANK[gameState.currentIndex];
            for (let i = 0; i < q.optionsPartB.length; i++) {
                const btn = document.getElementById(`ebsr-b-${i}`);
                if (i === index) {
                    btn.className = "w-full text-left p-2.5 rounded-lg border-2 border-amber-500 bg-amber-950/40 text-xs text-white transition font-semibold";
                } else {
                    btn.className = "w-full text-left p-2.5 rounded-lg border border-slate-800 bg-slate-900 text-xs text-slate-400 hover:bg-slate-800 transition opacity-60";
                }
            }
        }

        function submitAnswer() {
            const q = QUESTION_BANK[gameState.currentIndex];
            let isCorrect = false;

            if (q.type === 'single') {
                if (activeSelection === null) return;
                isCorrect = q.correct.includes(activeSelection);
            } else if (q.type === 'multi') {
                if (gameState.selectedMulti.length !== 2) return;
                const sortedSel = [...gameState.selectedMulti].sort().join(',');
                const sortedCorr = [...q.correct].sort().join(',');
                isCorrect = sortedSel === sortedCorr;
            } else if (q.type === 'ebsr') {
                if (gameState.selectedEbsrPartA === null || gameState.selectedEbsrPartB === null) return;
                isCorrect = (gameState.selectedEbsrPartA === q.correctPartA) && (gameState.selectedEbsrPartB === q.correctPartB);
            }

            gameState.categoryScores[q.category].total += 1;
            gameState.benchmarkScores[q.benchmark].total += 1;

            if (isCorrect) {
                soundFX.playCorrect();
                gameState.score += 1;
                gameState.streak += 1;
                gameState.categoryScores[q.category].correct += 1;
                gameState.benchmarkScores[q.benchmark].correct += 1;
                
                const baseXP = q.dok === 1 ? 100 : q.dok === 2 ? 150 : 200;
                const streakBonus = gameState.streak > 1 ? gameState.streak * 20 : 0;
                gameState.xp += (baseXP + streakBonus);
            } else {
                soundFX.playIncorrect();
                gameState.streak = 0;
            }

            updateHeaderStats();

            const expBox = document.getElementById('explanation-box');
            expBox.classList.remove('hidden');
            if (isCorrect) {
                expBox.className = "p-4 rounded-xl text-xs leading-relaxed bg-emerald-950/60 border border-emerald-500/40 text-emerald-200 animate-fade-in";
                expBox.innerHTML = `
                    <div class="font-bold text-emerald-400 text-sm mb-1 flex items-center gap-2">
                        <i class="fa-solid fa-circle-check"></i> CORRECT (+${q.dok * 100} XP)
                    </div>
                    ${q.explanation}
                `;
            } else {
                expBox.className = "p-4 rounded-xl text-xs leading-relaxed bg-red-950/60 border border-red-500/40 text-red-200 animate-fade-in";
                expBox.innerHTML = `
                    <div class="font-bold text-red-400 text-sm mb-1 flex items-center gap-2">
                        <i class="fa-solid fa-circle-xmark"></i> INCORRECT
                    </div>
                    ${q.explanation}
                `;
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.outerHTML = `
                <button onclick="nextQuestion()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                    CONTINUE TO NEXT ITEM <i class="fa-solid fa-arrow-right"></i>
                </button>
            `;
            activeSelection = null;
        }

        function nextQuestion() {
            soundFX.playClick();
            gameState.currentIndex += 1;
            if (gameState.currentIndex < QUESTION_BANK.length) {
                renderQuestion();
            } else {
                renderScorecard();
            }
        }

        /* 3. Diagnostic Scorecard & Official Canvas PDF Submission Report */

                        <h2 class="text-3xl md:text-5xl font-black text-white mb-2 print-text-dark">

                        <!-- Action Buttons -->

                                <i class="fa-solid fa-file-pdf"></i> DOWNLOAD SCORE REPORT (PDF FOR CANVAS)

                    <!-- Category Breakdown -->

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                            <div class="flex items-center justify-between">
                                <span class="text-xs font-bold text-blue-400 uppercase print-text-dark">Prose & Poetry</span>
                                <span class="text-xs font-bold text-white print-text-dark">${cat1Pct}%</span>
                            </div>
                            <p class="text-[11px] text-slate-400 print-text-muted">
                                ${gameState.categoryScores.prose_poetry.correct} / ${gameState.categoryScores.prose_poetry.total} Correct
                            </p>
                        </div>

                        <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800 space-y-2 print-card">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-bold text-purple-400 uppercase print-text-dark">Informational Text</span>
                                <span class="text-xs font-bold text-white print-text-dark">${cat2Pct}%</span>
                            </div>
                            <p class="text-[11px] text-slate-400 print-text-muted">

        /* 4. Arcade Skill Mini-Games */
        function renderArcadeHub() {
            stopTimer();
            soundFX.playClick();
            const container = document.getElementById('app-container');

            container.innerHTML = `
                <div class="max-w-5xl mx-auto w-full space-y-6 animate-fade-in py-4">
                    <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                        <div>
                            <h1 class="text-2xl font-black text-white flex items-center gap-2">
                                <i class="fa-solid fa-gamepad text-amber-400"></i> SKILL REVIEW ARCADE
                            </h1>
                            <p class="text-xs text-slate-400">Targeted rapid-fire drills aligned to Grade 6 ELA standards.</p>
                        </div>
                        <button onclick="renderWelcomeScreen()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold rounded-lg transition">

                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 hover:border-emerald-500/50 transition flex flex-col justify-between space-y-4">
                            <div>
                                <div class="w-12 h-12 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl font-bold mb-4">
                                    <i class="fa-solid fa-bolt"></i>
                                </div>
                                <h3 class="font-bold text-white text-lg mb-1">Root & Context Slinger</h3>

                            <button onclick="startRootSlingerGame()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold text-xs rounded-xl transition">

                                </div>
                                <h3 class="font-bold text-white text-lg mb-1">Text Structure Defender</h3>
                                <p class="text-xs text-slate-400 leading-relaxed">Categorize informational passages into Cause/Effect, Compare/Contrast, or Problem/Solution.</p>
                            </div>

                                PLAY GAME

                        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 hover:border-blue-500/50 transition flex flex-col justify-between space-y-4">

                                <div class="w-12 h-12 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-xl font-bold mb-4">

                                </div>

                                <p class="text-xs text-slate-400 leading-relaxed">Distinguish universal human themes from simple plot summaries in short story snippets.</p>
                            </div>
                            <button onclick="startThemeDetectiveGame()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl transition">
                                PLAY GAME
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        /* Arcade Mini Game 1 */
        function startRootSlingerGame() {
            soundFX.playClick();
            const container = document.getElementById('app-container');

            const roots = [
                { root: "CHRON", mean: "Time" },
                { root: "BIO", mean: "Life" },
                { root: "AQUA", mean: "Water" },
                { root: "SPEC", mean: "Look/See" },
                { root: "GRAPH", mean: "Write/Draw" }
            ];

            let curIndex = 0;
            let miniScore = 0;

            window.checkRootAns = function(selectedMean) {
                if (selectedMean === roots[curIndex].mean) {
                    soundFX.playCorrect();
                    miniScore += 100;
                } else {
                    soundFX.playIncorrect();
                }

                curIndex++;
                if (curIndex < roots.length) {
                    renderCard();
                } else {
                    container.innerHTML = `
                        <div class="max-w-md mx-auto text-center bg-slate-900 p-8 rounded-2xl border border-slate-800 space-y-4">
                            <h2 class="text-2xl font-bold text-white">ROOT SLINGER COMPLETE!</h2>
                            <p class="text-amber-400 font-bold text-xl">+${miniScore} XP EARNED</p>
                            <button onclick="renderArcadeHub()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-xs">
                                BACK TO ARCADE HUB
                            </button>
                        </div>
                    `;
                }
            };

            function renderCard() {
                const item = roots[curIndex];
                const shuffledMeans = [...roots].map(r => r.mean).sort(() => Math.random() - 0.5);

                container.innerHTML = `
                    <div class="max-w-lg mx-auto bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-6">
                        <div class="flex justify-between items-center text-xs text-slate-400">
                            <span>ROOT SLINGER DRILL</span>
                            <span>ITEM ${curIndex + 1}/${roots.length}</span>
                        </div>

                        <div class="text-center py-6 bg-slate-950 rounded-xl border border-slate-800">
                            <span class="text-xs text-emerald-400 font-bold uppercase tracking-wider block mb-1">Identify Root Meaning</span>
                            <h2 class="text-3xl font-black text-white pixel-font">${item.root}</h2>
                        </div>

                        <div class="grid grid-cols-1 gap-2.5">
                            ${shuffledMeans.map(m => `
                                <button onclick="checkRootAns('${m}')" class="p-3 bg-slate-800 hover:bg-emerald-600 hover:text-slate-950 text-white font-bold text-xs rounded-xl transition">
                                    ${m}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            renderCard();
        }

        /* Arcade Mini Game 2 */
        function startTextStructureGame() {
            soundFX.playClick();
            const container = document.getElementById('app-container');

            const questions = [
                { text: "Because high winds damaged power lines across the city, thousands of homes lost electricity for hours.", ans: "Cause & Effect" },
                { text: "While electric cars produce zero emissions, gasoline cars offer faster refueling times on long trips.", ans: "Compare & Contrast" },
                { text: "To eliminate traffic jams around school zones, administrators constructed a dedicated two-lane turning bay.", ans: "Problem & Solution" }
            ];

            let cur = 0;

            window.checkStruct = function(selected) {
                if (selected === questions[cur].ans) {
                    soundFX.playCorrect();
                } else {
                    soundFX.playIncorrect();
                }

                cur++;
                if (cur < questions.length) {
                    render();
                } else {
                    container.innerHTML = `
                        <div class="max-w-md mx-auto text-center bg-slate-900 p-8 rounded-2xl border border-slate-800 space-y-4">
                            <h2 class="text-2xl font-bold text-white">STRUCTURE DEFENDER COMPLETE!</h2>
                            <button onclick="renderArcadeHub()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-xs">
                                BACK TO ARCADE HUB
                            </button>
                        </div>
                    `;
                }
            };

            function render() {
                const item = questions[cur];
                container.innerHTML = `
                    <div class="max-w-lg mx-auto bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-6">
                        <div class="text-xs text-slate-400">STRUCTURE DEFENDER (${cur + 1}/${questions.length})</div>
                        <p class="p-4 bg-slate-950 rounded-xl border border-slate-800 text-sm text-slate-200">${item.text}</p>
                        <div class="grid grid-cols-1 gap-2">
                            ${["Cause & Effect", "Compare & Contrast", "Problem & Solution"].map(type => `
                                <button onclick="checkStruct('${type}')" class="p-3 bg-slate-800 hover:bg-purple-600 text-white font-bold text-xs rounded-xl transition">
                                    ${type}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            render();
        }

        /* Arcade Mini Game 3 */
        function startThemeDetectiveGame() {
            soundFX.playClick();
            const container = document.getElementById('app-container');

            const items = [
                { statement: "Hard work and perseverance overcome obstacles.", type: "Universal Theme" },

            window.checkTheme = function(type) {

                    soundFX.playCorrect();

                    soundFX.playIncorrect();

                cur++;
                if (cur < items.length) {

                    container.innerHTML = `

                            <h2 class="text-2xl font-bold text-white">THEME DETECTIVE COMPLETE!</h2>
                            <button onclick="renderArcadeHub()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-xs">
                                BACK TO ARCADE HUB
                            </button>
                        </div>
                    `;
                }
            };

            function render() {
                const item = items[cur];
                container.innerHTML = `
                    <div class="max-w-lg mx-auto bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-6">
                        <div class="text-xs text-slate-400">THEME DETECTIVE (${cur + 1}/${items.length})</div>
                        <p class="p-4 bg-slate-950 rounded-xl border border-slate-800 text-sm font-semibold text-white">"${item.statement}"</p>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="checkTheme('Universal Theme')" class="p-4 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl transition">
                                UNIVERSAL THEME

                            <button onclick="checkTheme('Plot Summary')" class="p-4 bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs rounded-xl transition">
                                PLOT SUMMARY
                            </button>
                        </div>
                    </div>
                `;
            }
            render();
        }
    </script>
